<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estacionamento - Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Slate 900 */
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            padding: 30px 20px;
            color: #334155;
        }

        /* Estrutura do Formulário em Painel Dashboard (2 Colunas) */
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px 20px;
            align-items: center;
            width: 100%;
            max-width: 780px;
            background: #ffffff;
            padding: 50px 45px 40px;
            border-radius: 20px;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            position: relative;
            animation: containerAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Crachá / Badge do Sistema no Topo (Criado via Pseudo-elemento) */
        form::before {
            content: '• PARK CONTROL • GESTÃO DE ESTACIONAMENTO';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #2563eb;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            white-space: nowrap;
        }

        /* Título Principal ocupando toda a largura */
        h2 {
            grid-column: 1 / -1;
            color: #0f172a;
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Ícone [P] ao lado do título */
        h2::before {
            content: 'P';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #f59e0b;
            color: #0f172a;
            font-weight: 900;
            border-radius: 10px;
            font-size: 20px;
        }

        h2::after {
            content: '';
            display: none; /* Removida a barra antiga */
        }

        /* Subtítulo da Data */
        h4 {
            grid-column: 1 / -1;
            color: #64748b;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
            margin-bottom: -6px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 8px;
        }

        /* Mapeamento das Posições dos Inputs na Grid */
        #inputNome { grid-column: 1; }
        #inputCPF { grid-column: 2; }
        #inputEmailCadastro { grid-column: 1; }
        #inputSenhaCadastro { grid-column: 2; }
        #inputDataNascimento { grid-column: 1; }
        #inputTelefone { grid-column: 2; }

        /* Estilização Geral dos Inputs com Ícones Embutidos */
        input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px; /* Espaço para o ícone */
            margin: 0;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            background-color: #f8fafc;
            background-repeat: no-repeat;
            background-position: 14px center;
            background-size: 18px 18px;
            color: #1e293b;
            outline: none;
            font-family: inherit;
            transition: all 0.2s ease-in-out;
            opacity: 1; /* Reset da animação antiga */
            animation: none;
        }

        /* Ícones SVG embutidos via CSS */
        #inputNome {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>');
        }

        #inputCPF {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 012-2h2a2 2 0 012 2v1m-4 0h4"/></svg>');
        }

        #inputEmailCadastro {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>');
        }

        #inputSenhaCadastro {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>');
        }

        #inputDataNascimento {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>');
        }

        #inputTelefone {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2394a3b8" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>');
        }

        /* Estados dos Inputs (Focus / Hover) */
        input:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        input:hover:not(:focus) {
            border-color: #cbd5e1;
            background-color: #ffffff;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input[type="date"] {
            color: #64748b;
            cursor: pointer;
        }

        input[type="date"]:focus {
            color: #1e293b;
        }

        /* Botão de Envio (Ocupa as 2 Colunas) */
        button[type="submit"] {
            grid-column: 1 / -1;
            height: 52px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        /* Link Inferior de Login */
        h3 {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
        }

        h3 a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 700;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        h3 a:hover {
            color: #1d4ed8;
            text-decoration: underline;
        }

        /* Animação suave de entrada */
        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Adaptação Responsiva para Celulares (Volta para 1 Coluna) */
        @media (max-width: 640px) {
            form {
                grid-template-columns: 1fr;
                padding: 40px 24px 30px;
                gap: 14px;
            }

            #inputNome, #inputCPF,
            #inputEmailCadastro, #inputSenhaCadastro,
            #inputDataNascimento, #inputTelefone {
                grid-column: 1 / -1;
            }

            h2 {
                font-size: 24px;
            }

            form::before {
                font-size: 9px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

<form method="post" action="/efetuarCadastro">
    <h2>Cadastro</h2>

    <input type="text" name="inputNomeCadastro" id="inputNome" placeholder="Insira seu nome">
    <input type="number" name="inputCPFCadastro" id="inputCPF" placeholder="Insira seu CPF">
    <input type="email" id="inputEmailCadastro" name="inputEmailCadastro" placeholder="Insira seu email">
    <input type="password" id="inputSenhaCadastro" name="inputSenhaCadastro" placeholder="Insira sua senha">

    <h4>Insira sua data de nascimento</h4>

    <input type="date" name="inputDataNascimentoCadastro" id="inputDataNascimento">

    <input type="number" name="inputTelefone" id="inputTelefone" placeholder="Insira seu telefone">

    <button type="submit">Cadastrar</button>

    <h3>Já tem cadastro? <a href="/">Clique aqui</a></h3>
</form>

</body>
</html>
