<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Estacionamento - Registrar Entrada</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a; /* Slate 900 */
            background-image:
                radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.1) 0px, transparent 50%);
            padding: 30px 20px;
            color: #334155;
        }

        /* Container Principal / Card */
        .container {
            background: #ffffff;
            padding: 50px 40px 40px;
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            position: relative;
            z-index: 1;
            box-shadow:
                0 25px 50px -12px rgba(0, 0, 0, 0.35),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            animation: containerAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Crachá / Badge Superior */
        .container::before {
            content: '• PARK CONTROL • REGISTRAR ENTRADA';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            background: #2563eb;
            color: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 6px 18px;
            border-radius: 20px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
            white-space: nowrap;
        }

        /* Título Principal */
        h1 {
            color: #0f172a;
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 28px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        h1::before {
            content: 'P';
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: #f59e0b;
            color: #0f172a;
            font-weight: 900;
            border-radius: 10px;
            font-size: 19px;
            box-shadow: 0 4px 10px rgba(245, 158, 11, 0.25);
        }

        h1::after {
            content: '';
            display: none;
        }

        /* Rótulos dos Campos */
        label {
            display: block;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            letter-spacing: 0.2px;
        }

        /* Campos de Entrada e Áreas de Texto */
        input,
        textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 18px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            color: #1e293b;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        input:hover:not(:focus),
        textarea:hover:not(:focus) {
            border-color: #cbd5e1;
            background-color: #ffffff;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Layout dos Botões */
        .botoes {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button,
        .voltar {
            flex: 1;
            height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            box-sizing: border-box;
        }

        /* Botão Primário */
        button {
            border: none;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
        }

        button:hover {
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Botão Secundário / Voltar */
        .voltar {
            border: 1.5px solid #cbd5e1;
            background: #ffffff;
            color: #475569;
        }

        .voltar:hover {
            background: #f8fafc;
            border-color: #94a3b8;
            color: #0f172a;
            transform: translateY(-1px);
        }

        .voltar:active {
            transform: translateY(1px);
        }

        /* Animação de Entrada */
        @keyframes containerAppear {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .container {
                padding: 40px 24px 30px;
            }

            .container::before {
                font-size: 9px;
                padding: 4px 12px;
            }

            h1 {
                font-size: 22px;
            }

            .botoes {
                flex-direction: column-reverse;
                gap: 10px;
            }

            button,
            .voltar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Registrar Entrada</h1>

    <form method="post" action="/veiculo/cadastrar">

        <label for="placa">Placa</label>
        <input
                type="text"
                id="placa"
                name="placa"
                placeholder="Ex: ABC1D23"
                required
        >

        <label for="modelo">Modelo</label>
        <input
                type="text"
                id="modelo"
                name="modelo"
                placeholder="Ex: Honda Civic"
                required
        >

        <label for="cor">Cor</label>
        <input
                type="text"
                id="cor"
                name="cor"
                placeholder="Ex: Preto"
                required
        >

        <label for="observacao">Observação</label>
        <textarea
                id="observacao"
                name="observacao"
                placeholder="Digite alguma observação..."
        ></textarea>

        <div class="botoes">
            <a href="/" class="voltar">Voltar</a>
            <button type="submit">Registrar Entrada</button>
        </div>

    </form>

</div>

</body>
</html>
