<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento - Erro Login</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a; /* Slate 900 */
        background-image:
            radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.12) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(37, 99, 235, 0.1) 0px, transparent 50%);
        padding: 30px 20px;
        color: #334155;
    }

    /* Card do Painel de Erro */
    .container {
        background: #ffffff;
        padding: 50px 40px 40px;
        border-radius: 20px;
        max-width: 460px;
        width: 100%;
        position: relative;
        text-align: center;
        box-shadow:
            0 25px 50px -12px rgba(0, 0, 0, 0.35),
            0 0 0 1px rgba(255, 255, 255, 0.1);
        border-top: 6px solid #ef4444; /* Borda de Alerta */
        animation: containerAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Crachá / Badge do Sistema no Topo */
    .container::before {
        content: '• PARK CONTROL • AUTENTICAÇÃO';
        position: absolute;
        top: -15px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        color: #ffffff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.5px;
        padding: 6px 18px;
        border-radius: 20px;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        white-space: nowrap;
    }

    /* Ícone de Erro Destacado */
    .error-icon {
        width: 72px;
        height: 72px;
        margin: 10px auto 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: #fef2f2;
        border: 2px solid #fecaca;
        font-size: 28px;
        box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15);
        animation: pulseIcon 2s infinite;
    }

    h1 {
        color: #0f172a;
        font-size: 22px;
        font-weight: 800;
        margin-bottom: 12px;
        letter-spacing: -0.5px;
    }

    h1::after {
        content: '';
        display: none;
    }

    .message {
        color: #64748b;
        font-size: 15px;
        line-height: 1.6;
        margin: 16px 0 28px;
        font-weight: 400;
    }

    /* Botão Voltar Padronizado */
    .btn-voltar {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 50px;
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.5px;
        transition: all 0.2s ease;
        box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-voltar:hover {
        background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
    }

    .btn-voltar:active {
        transform: translateY(1px);
    }

    @keyframes containerAppear {
        from {
            opacity: 0;
            transform: translateY(24px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes pulseIcon {
        0%, 100% {
            transform: scale(1);
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.2);
        }
        50% {
            transform: scale(1.05);
            box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 40px 24px 30px;
        }

        .container::before {
            font-size: 9px;
            padding: 4px 12px;
        }

        .error-icon {
            width: 60px;
            height: 60px;
            font-size: 24px;
        }

        h1 {
            font-size: 20px;
        }

        .message {
            font-size: 14px;
        }
    }
  </style>
</head>
<body>

<div class="container">
  <span class="error-icon">❌</span>

  <h1>Usuário ou senha inválido!</h1>

  <p class="message">
    Por favor, verifique suas credenciais e tente novamente.
  </p>

  <a href="/" class="btn-voltar">↩ Voltar ao Login</a>
</div>

</body>
</html>
